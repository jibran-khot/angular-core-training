<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="dashboard.css">

    <title>Dashboard Setup</title>
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="logo">
                Logo
            </div>

            <nav class="navbar">

                <ul>
                    <li>Dashboard</li>
                    <li>Users</li>
                    <li>Reports</li>
                    <li>Settings</li>
                </ul>

            </nav>

        </aside>

        <main class="main-area">
            <header class="dashboard-header">
                <div class="page-title">Dashboard</div>
                <span class="user-info">Profile : Admin</span>
            </header>

            <section class="stats-grid">
                <div class="stats-card">
                    <h3>Total Users</h3>
                    <p>1250</p>
                </div>
                <div class="stats-card">
                    <h3>Revenue</h3>
                    <p>8000</p>
                </div>
                <div class="stats-card">
                    <h3>Orders</h3>
                    <p>400</p>
                </div>
                <div class="stats-card">
                    <h3>Growth</h3>
                    <p>25%</p>
                </div>
            </section>


        </main>

    </div>

</body>

</html>
